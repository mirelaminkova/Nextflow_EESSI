---
- name: Configure node for access to the EESSI stack
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - sudo
          - wget
          - lmod
        state: present
        update_cache: yes

    - name: Download EESSI installation script
      get_url:
        url: https://raw.githubusercontent.com/EESSI/eessi-demo/23da78bd7cc56332cceb9567bf67be637af91946/scripts/install_cvmfs_eessi.sh
        dest: /tmp/install_cvmfs_eessi.sh
        mode: '0755'

    - name: Execute the EESSI installation script
      shell: /tmp/install_cvmfs_eessi.sh
      args:
        executable: /bin/bash

    - name: Verify cvmfs_talk command
      shell: "command -v cvmfs_talk"
      register: cvmfs_talk_output
      ignore_errors: yes

    - name: Fail if cvmfs_talk command not found
      fail:
        msg: "'cvmfs_talk' command is not available. EESSI client installation failed."
      when: cvmfs_talk_output.rc != 0

    - name: Add private Stratum 1 to list of Stratum 1s
      when: src_stratum1_host is defined
      block:
        - name: Copy domain template
          copy:
            src: files/template-eessi-hpc.org.local
            dest: /etc/cvmfs/domain.d/eessi-hpc.org.local
            force: true
            mode: '0664'

        - name: Substitute template variables with values
          replace:
            path: /etc/cvmfs/domain.d/eessi-hpc.org.local
            regexp: "{{ item.variable }}"
            replace: "{{ item.value }}"
          loop:
            - { variable: "_src_stratum1_host_", value: "{{ src_stratum1_host }}" }

        - name: Update EESSI configuration
          shell: cvmfs_config probe pilot.eessi-hpc.org

        - name: Probe Stratum 1 servers by geo location
          shell: cvmfs_talk -i pilot.eessi-hpc.org host probe geo

- name: Deploy EESSI Nextflow environment initialization
  hosts: localhost
  become: yes
  gather_facts: yes
  vars:
    # SRC parameter behind the catalog item's "S3 bucket resource" field.
    # The variable name is assumed (not recorded in this repo); rename it here
    # if the catalog item uses a different one. Accepts `bucket`,
    # `s3://bucket` or `s3://bucket/`.
    nf_s3_bucket_param: "{{ src_s3_bucket | default('') }}"
    nf_s3_bucket: "{{ nf_s3_bucket_param | trim | regex_replace('^s3://', '') | regex_replace('/+$', '') }}"
    # Group allowed to read the generated config when it holds secrets
    # (TES password / S3 keys). Users outside it will not get the config seeded.
    nf_config_group: root
    # A single backslash, for escaping values into Groovy '...' strings.
    nf_bs: "\\"
    nf_config_has_secrets: "{{ (src_tes_password | default('')) != '' or (src_s3_access_key_id | default('')) != '' or (src_s3_secret_access_key | default('')) != '' }}"
  tasks:
    - name: Create /etc/profile.d/eessi_nextflow.sh file
      copy:
        dest: /etc/profile.d/eessi_nextflow.sh
        content: |
          #!/bin/bash
          # /etc/profile.d/eessi_nextflow.sh
          #
          # Sets up the EESSI 2025.06 environment and loads Nextflow, making it
          # available in interactive shells.
          #
          # We source EESSI's own init script rather than hardcoding MODULEPATH:
          # init/bash runs archdetect and sets MODULEPATH/Lmod for whatever CPU
          # this node has (zen2/zen3/zen4/intel/neoverse/...), so the same plugin
          # works on any SRC flavour.

          # Skip for non-interactive shells: EESSI init prints a banner to stdout,
          # which would corrupt scp/sftp/rsync sessions.
          [ -z "$PS1" ] && return

          if [ -r /cvmfs/software.eessi.io/versions/2025.06/init/bash ]; then
              source /cvmfs/software.eessi.io/versions/2025.06/init/bash
              module load Nextflow/26.04.0
          fi

          # Seed a per-user Nextflow config the first time, so runs automatically
          # pick up the TES (Pulsar / TESP-API) settings. ~/.nextflow is writable,
          # which Nextflow needs for plugin downloads (/etc/nextflow is not).
          # The copy is private (0600): it may hold the TES password / S3 keys.
          if [ ! -f "$HOME/.nextflow/config" ] && [ -r /etc/nextflow/nextflow.config ]; then
              mkdir -p "$HOME/.nextflow"
              install -m 600 /etc/nextflow/nextflow.config "$HOME/.nextflow/config"
          fi
        mode: '0755'
        owner: root
        group: root

    - name: Ensure /etc/nextflow exists
      file:
        path: /etc/nextflow
        state: directory
        mode: '0755'

    - name: Deploy Nextflow TES (TESP-API / Pulsar) connection config
      # Connects the Nextflow client to a GA4GH TES endpoint (TESP-API in front
      # of Pulsar) and points the work directory at the S3 bucket. Values come
      # from SRC plugin parameters; keep the TES password and S3 keys in secret
      # parameters. When any secret is set the file is 0640 root:nf_config_group
      # (not world-readable) and no_log keeps it out of Ansible output;
      # otherwise it is 0644. Each user's ~/.nextflow/config is seeded from it.
      no_log: true
      copy:
        dest: /etc/nextflow/nextflow.config
        owner: root
        group: "{{ nf_config_group }}"
        mode: "{{ '0640' if nf_config_has_secrets | bool else '0644' }}"
        content: |
          {% macro q(v) %}'{{ v | string | replace(nf_bs, nf_bs ~ nf_bs) | replace("'", nf_bs ~ "'") }}'{% endmacro %}
          // Managed by Ansible (Nextflow_EESSI). GA4GH TES -> Pulsar via TESP-API.
          //
          // To make TES opt-in rather than the default executor, move the
          // `process`/`tes` blocks into `profiles { tes { ... } }` and launch
          // pipelines with `-profile tes`.
          //
          // IMPORTANT: the TES executor stages task inputs/outputs by URL, so the
          // Nextflow work directory must live on object storage (S3), not a local
          // path. A local `-w ./work` will be rejected by TESP-API with
          // "invalid or missing URL scheme".
          plugins {
              id 'nf-ga4gh'
          }

          process {
              executor = 'tes'
          }

          tes {
              endpoint      = {{ q(src_tes_endpoint | default("http://localhost:8080")) }}
              basicUsername = {{ q(src_tes_username | default("")) }}
              basicPassword = {{ q(src_tes_password | default("")) }}
          }
          {% if nf_s3_bucket %}

          workDir = 's3://{{ nf_s3_bucket }}/work'
          {% else %}

          // No S3 bucket configured: launch with an object-store work dir, e.g.
          //     nextflow run <pipeline> -w s3://<bucket>/work
          {% endif %}
          {% set s3_style = src_s3_addressing_style | default('') | trim | lower %}
          {% set aws_main = [] %}
          {% if src_s3_access_key_id | default('') %}{% set _ = aws_main.append('accessKey = ' ~ q(src_s3_access_key_id)) %}{% endif %}
          {% if src_s3_secret_access_key | default('') %}{% set _ = aws_main.append('secretKey = ' ~ q(src_s3_secret_access_key)) %}{% endif %}
          {% if src_s3_region | default('') %}{% set _ = aws_main.append('region    = ' ~ q(src_s3_region)) %}{% endif %}
          {% set aws_client = [] %}
          {% if src_s3_endpoint_url | default('') %}{% set _ = aws_client.append('endpoint          = ' ~ q(src_s3_endpoint_url)) %}{% endif %}
          {% if s3_style == 'path' %}{% set _ = aws_client.append('s3PathStyleAccess = true') %}{% elif s3_style == 'virtual' %}{% set _ = aws_client.append('s3PathStyleAccess = false') %}{% endif %}
          {% if aws_main or aws_client %}

          aws {
          {% for line in aws_main %}
              {{ line }}
          {% endfor %}
          {% if aws_client %}
              client {
          {% for line in aws_client %}
                  {{ line }}
          {% endfor %}
              }
          {% endif %}
          }
          {% endif %}
